<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- The macOS disk image's window background. Its size and the icons' places are dmg-layout.py's: BACKGROUND_SIZE,
       the window's width and taller than any title bar leaves of its height; the app's icon centred at 160,165 and
       Applications' at 440,165, each 128 across with its name under it. Light whatever the appearance, since the
       picture does not follow it and Finder writes the names black over a light one in Dark too; the colours are the
       app icon's. -->
  <defs>
    <radialGradient id="blue" cx="60" cy="0" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BF2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2F6BF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="560" cy="360" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="244" y1="0" x2="358" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BF2"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#FFFFFF"/>
  <rect width="600" height="400" fill="url(#blue)"/>
  <rect width="600" height="400" fill="url(#teal)"/>
  <text x="300" y="66" text-anchor="middle" font-family="Helvetica Neue" font-size="18"
        fill="#1E1F22">Drag Passenger to Applications</text>
  <!-- The arrow from the app to Applications, level with their icons' centres. -->
  <path d="M 250 165 H 350 M 336 151 L 350 165 L 336 179" fill="none" stroke="url(#route)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
